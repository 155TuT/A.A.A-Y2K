[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arrow-y2k"
dynamic = ["version"]
description = "一箭又一箭 — a Textual pixel puzzle"
requires-python = ">=3.11"
dependencies = ["textual==6.12.0", "pygame-ce==2.5.8", "Pillow==12.3.0", "platformdirs>=4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff==0.16.8"]
build = ["pyinstaller==6.22.3"]

[project.urls]
Homepage = "https://github.com/155TuT/A.A.A-Y2K"

[tool.setuptools.dynamic]
version = {attr = "arrow_y2k.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arrow_y2k = ["*.tcss", "assets/fonts/*", "assets/icons/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tools"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These scripts set up the checkout import path before importing the app.
"tools/capture_*.py" = ["E402"]
"tools/verify_demo.py" = ["E402"]
# Imports expose the packaged unittest cases to pytest collection.
"tests/test_shared_contract.py" = ["F401"]

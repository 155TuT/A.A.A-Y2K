name: Native builds and shared contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/build.py'
      - 'run.py'
      - 'pyproject.toml'
      - '.github/workflows/build.yml'
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build and development dependencies
        run: python -m pip install '.[build,dev]'
      - name: Development tests
        run: python -m pytest -q
      - name: Native package, embedded tests and parity gate
        run: python tools/build.py
      - name: Upload native distribution and audit reports
        uses: actions/upload-artifact@v4
        with:
          name: A.A.A-Y2K-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/build-manifest.json
            build/reports/*.json
          if-no-files-found: error

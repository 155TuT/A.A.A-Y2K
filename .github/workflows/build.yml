name: Native installers and release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this version after all native checks pass
        type: boolean
        default: false
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'packaging/**'
      - 'run.py'
      - 'pyproject.toml'
      - '.github/workflows/**'
      - '.gitattributes'
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYGAME_HIDE_SUPPORT_PROMPT: '1'
  SDL_AUDIODRIVER: dummy

jobs:
  native:
    name: Build and install (${{ matrix.target }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
            installer: '--installer'
          - os: macos-14
            target: macos-arm64
            installer: '--installer'
          - os: macos-15-intel
            target: macos-x64
            installer: '--installer'
          - os: ubuntu-22.04
            target: linux-x64
            installer: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/constraints.txt
      - name: Install build and development dependencies
        run: |
          python -m pip install -c packaging/constraints.txt setuptools
          python -m pip install --no-build-isolation -c packaging/constraints.txt '.[build,dev]'
      - name: Validate version and architecture
        shell: bash
        run: |
          python tools/build.py --validate-version
          python -c "import sys; sys.path.insert(0, 'tools'); from build_support import target_name; assert target_name() == '${{ matrix.target }}', target_name()"
      - name: Install checksum-pinned Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/install-inno.ps1
      - name: Static checks
        run: python -m ruff check src tools tests run.py
      - name: Development tests
        run: python -m pytest -q --junitxml=build/reports/pytest.xml
      - name: Build native packages and verify embedded tests
        run: python tools/build.py ${{ matrix.installer }}
      - name: Install and launch (Windows and macOS)
        if: runner.os != 'Linux'
        run: python tools/verify_installers.py
      - name: Extract and launch (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/verify_installers.py
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.target }}
          path: build/reports/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish complete verified release
    needs: native
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.5'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-artifacts
      - name: Validate all hashes, upload to draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release.py release-artifacts --publish

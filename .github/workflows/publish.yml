name: Publish verified artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed native workflow run with four successful installation jobs
        required: true
        type: string
      tag:
        description: Existing version tag matching the artifacts (for example v0.4.0)
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out the publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out the original release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          path: release-source
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.5'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: release-*
          merge-multiple: true
          path: release-artifacts
      - name: Validate the original run and source, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python -c 'import os, runpy; version = runpy.run_path("release-source/src/arrow_y2k/__init__.py")["__version__"]; assert os.environ["RELEASE_TAG"] == "v" + version'
          python tools/release.py release-artifacts --source-root release-source --source-run "$SOURCE_RUN" --publish
